<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTLAB — Hacking Practice</title>
  <style>
    :root {
      --bg:        #050510;
      --bg-card:   #0b0b1c;
      --bg-input:  #080816;
      --border:    #182040;
      --text-dim:  #4a6a8a;
      --text:      #8ab0cc;
      --text-hi:   #c0d8f0;
      --accent:    #00b8e8;
      --yellow:    #f0c000;
      --green:     #00e070;
      --red:       #ff2840;
      --p0:        #ff5555;
      --p1:        #f0c000;
      --p2:        #44e088;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
    }

    /* CRT scanlines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 3px,
        rgba(0,0,0,0.06) 3px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: 460px;
      max-width: calc(100vw - 24px);
      padding: 0 0 4px;
    }

    /* ── Header ── */
    .hdr {
      text-align: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .hdr-eyebrow {
      font-size: 9px;
      letter-spacing: 6px;
      color: var(--accent);
      opacity: 0.65;
      text-transform: uppercase;
    }
    .hdr-title {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 7px;
      color: var(--text-hi);
      margin-top: 3px;
    }

    /* ── Stats row ── */
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg-card);
      padding: 10px 12px 10px;
      text-align: center;
    }
    .stat-lbl {
      font-size: 9px;
      letter-spacing: 4px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .stat-val {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--text-hi);
      line-height: 1;
      transition: color 0.1s;
      min-width: 2ch;
      display: inline-block;
    }
    #v-result.preview { color: var(--accent); }
    #v-result.match   { color: var(--green);  text-shadow: 0 0 16px var(--green); }
    #v-result.over    { color: var(--red);    text-shadow: 0 0 12px var(--red);   }

    /* ── Arena ── */
    .arena {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    .col-l { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .col-r { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .col-c { display: flex; flex-direction: column; gap: 8px; align-items: center; }

    /* individual item */
    .item {
      width: 76px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-hi);
      position: relative;
      transition: border-color .12s, color .12s, box-shadow .12s, background .12s;
    }

    /* cursor highlight */
    .item.cur-n {
      border-color: var(--yellow);
      color: var(--yellow);
      background: rgba(240,192,0,.06);
      box-shadow: 0 0 14px rgba(240,192,0,.22);
    }
    .item.cur-s {
      border-color: var(--yellow);
      color: var(--yellow);
      background: rgba(240,192,0,.06);
      box-shadow: 0 0 14px rgba(240,192,0,.22);
    }

    /* confirmed */
    .item.done {
      color: #1e2a40;
      border-color: #0e1428;
      background: #06080f;
    }
    .item .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .item .mult-tag {
      position: absolute;
      bottom: 4px;
      right: 5px;
      font-size: 9px;
      font-weight: normal;
      letter-spacing: 0;
      opacity: 0.75;
    }

    /* center connector */
    .mid-cell {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border);
      font-size: 16px;
      transition: color .12s;
    }
    .mid-cell.active {
      color: var(--yellow);
    }
    .mid-cell.linked-0 { color: var(--p0); }
    .mid-cell.linked-1 { color: var(--p1); }
    .mid-cell.linked-2 { color: var(--p2); }

    /* ── Confirmed log ── */
    .log {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-bottom: 20px;
      min-height: 72px;
    }
    .log-title {
      font-size: 9px;
      letter-spacing: 4px;
      color: var(--text-dim);
      margin-bottom: 9px;
    }
    .log-entries { display: flex; flex-direction: column; gap: 5px; }
    .log-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      letter-spacing: .5px;
      opacity: 0;
      animation: fade-in .22s forwards;
    }
    @keyframes fade-in { to { opacity: 1; } }
    .log-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .log-empty {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      opacity: .45;
    }

    /* ── Controls ── */
    .ctrl {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: center;
    }
    .ctrl-hint {
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .kbd {
      display: inline-block;
      border: 1px solid var(--border);
      padding: 1px 5px;
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 0;
      line-height: 1.6;
    }

    /* ── Overlays ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2,2,12,.92);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .overlay.show { display: flex; }

    .ov-title {
      font-size: 46px;
      font-weight: bold;
      letter-spacing: 9px;
      line-height: 1;
    }
    #ov-win  .ov-title { color: var(--green); text-shadow: 0 0 30px rgba(0,224,112,.5); }
    #ov-fail .ov-title { color: var(--red);   text-shadow: 0 0 24px rgba(255,40,64,.5); }

    .ov-sub {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .ov-detail {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--text);
      margin-top: 2px;
    }
    .ov-btn {
      margin-top: 20px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      padding: 9px 26px;
      cursor: pointer;
      transition: background .15s, color .15s;
      text-transform: uppercase;
    }
    .ov-btn:hover, .ov-btn:focus {
      background: var(--accent);
      color: var(--bg);
      outline: none;
    }

    /* flash confirm */
    @keyframes confirm-flash {
      0%   { opacity: .2; }
      100% { opacity: 1; }
    }
    .flash { animation: confirm-flash .28s ease-out; }
  </style>
</head>
<body>

<div class="app">
  <div class="hdr">
    <div class="hdr-eyebrow">GTA ONLINE</div>
    <div class="hdr-title">VOLTLAB</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-lbl">TARGET</div>
      <div><span class="stat-val" id="v-target">—</span></div>
    </div>
    <div class="stat">
      <div class="stat-lbl">RESULT</div>
      <div><span class="stat-val" id="v-result">0</span></div>
    </div>
  </div>

  <div class="arena" id="arena">
    <!-- built by JS -->
  </div>

  <div class="log">
    <div class="log-title">CONFIRMED PAIRS</div>
    <div class="log-entries" id="log"></div>
  </div>

  <div class="ctrl">
    <div class="ctrl-hint"><span class="kbd">↑ ↓</span> 数字選択</div>
    <div class="ctrl-hint"><span class="kbd">← →</span> 記号選択</div>
    <div class="ctrl-hint"><span class="kbd">ENTER</span> 確定</div>
    <div class="ctrl-hint"><span class="kbd">R</span> リセット</div>
  </div>
</div>

<!-- Win overlay -->
<div class="overlay" id="ov-win">
  <div class="ov-title">SUCCESS</div>
  <div class="ov-sub">ハッキング完了</div>
  <button class="ov-btn" onclick="init()">[ もう一度 ]</button>
</div>

<!-- Fail overlay -->
<div class="overlay" id="ov-fail">
  <div class="ov-title">FAILED</div>
  <div class="ov-sub" id="fail-reason">ターゲット超過</div>
  <div class="ov-detail" id="fail-detail"></div>
  <button class="ov-btn" onclick="init()">[ リトライ ]</button>
</div>

<script>
// ────────────────────────────────────────────────
// Constants
// ────────────────────────────────────────────────
const MULT_POOL  = [1, 2, 3, 5, 10, 15];
const SYM_CHARS  = ['◈', '◉', '⬡', '◆', '▲', '✦'];
const PAIR_COLORS = ['#ff5555', '#f0c000', '#44e088'];

// ────────────────────────────────────────────────
// Game state
// ────────────────────────────────────────────────
let G = {};

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function pick(arr, n) { return shuffle(arr).slice(0, n); }

function init() {
  const nums  = pick([1,2,3,4,5,6,7,8], 3);
  const chars = pick(SYM_CHARS, 3);
  const mults = pick(MULT_POOL, 3);
  const syms  = chars.map((c, i) => ({ c, m: mults[i] }));

  // Guarantee a valid solution exists
  const perm   = shuffle([0, 1, 2]);
  const target = nums.reduce((s, n, i) => s + n * syms[perm[i]].m, 0);

  G = {
    nums, syms, target,
    pairs: [],          // [{ni, si, val}, ...]  confirmed pairs
    usedN: new Set(),
    usedS: new Set(),
    nc: 0,              // number cursor index
    sc: 0,              // symbol cursor index
    state: 'play',      // 'play' | 'win' | 'lose'
    sum: 0,
  };

  document.getElementById('ov-win').classList.remove('show');
  document.getElementById('ov-fail').classList.remove('show');
  draw();
}

// ────────────────────────────────────────────────
// Navigation helpers
// ────────────────────────────────────────────────
function nextFree(used, cur, dir) {
  let i = cur;
  for (let t = 0; t < 3; t++) {
    i = (i + dir + 3) % 3;
    if (!used.has(i)) return i;
  }
  return cur; // all used (shouldn't happen during play)
}

// ────────────────────────────────────────────────
// Confirm current pair
// ────────────────────────────────────────────────
function confirm() {
  const { nc, sc, nums, syms, usedN, usedS, sum, target } = G;
  if (usedN.has(nc) || usedS.has(sc)) return;

  const val    = nums[nc] * syms[sc].m;
  const newSum = sum + val;

  if (newSum > target) {
    G.state = 'lose';
    draw();
    setTimeout(() => {
      document.getElementById('fail-reason').textContent = 'ターゲット超過';
      document.getElementById('fail-detail').textContent =
        `${newSum} > ${target} (+${newSum - target})`;
      document.getElementById('ov-fail').classList.add('show');
    }, 250);
    return;
  }

  const pairIdx = G.pairs.length;
  G.pairs.push({ ni: nc, si: sc, val, pairIdx });
  usedN.add(nc);
  usedS.add(sc);
  G.sum = newSum;

  if (G.pairs.length === 3) {
    G.state = newSum === target ? 'win' : 'lose';
    draw();
    setTimeout(() => {
      if (G.state === 'win') {
        document.getElementById('ov-win').classList.add('show');
      } else {
        document.getElementById('fail-reason').textContent = '合計が不一致';
        document.getElementById('fail-detail').textContent =
          `RESULT ${newSum} ≠ TARGET ${target}`;
        document.getElementById('ov-fail').classList.add('show');
      }
    }, 250);
    return;
  }

  // Advance cursors to next available
  G.nc = nextFree(usedN, nc, 1);
  G.sc = nextFree(usedS, sc, 1);
  draw();
}

// ────────────────────────────────────────────────
// Preview value (confirmed sum + current selection)
// ────────────────────────────────────────────────
function preview() {
  const { nc, sc, nums, syms, usedN, usedS, sum } = G;
  if (usedN.has(nc) || usedS.has(sc)) return sum;
  return sum + nums[nc] * syms[sc].m;
}

// ────────────────────────────────────────────────
// Keyboard handler
// ────────────────────────────────────────────────
function onKey(e) {
  if (G.state !== 'play') {
    if (e.key === 'r' || e.key === 'R') init();
    return;
  }
  switch (e.key) {
    case 'ArrowUp':    e.preventDefault(); G.nc = nextFree(G.usedN, G.nc, -1); draw(); break;
    case 'ArrowDown':  e.preventDefault(); G.nc = nextFree(G.usedN, G.nc,  1); draw(); break;
    case 'ArrowLeft':  e.preventDefault(); G.sc = nextFree(G.usedS, G.sc, -1); draw(); break;
    case 'ArrowRight': e.preventDefault(); G.sc = nextFree(G.usedS, G.sc,  1); draw(); break;
    case 'Enter':      e.preventDefault(); confirm();                           break;
    case 'r': case 'R': init(); break;
  }
}

// ────────────────────────────────────────────────
// Render
// ────────────────────────────────────────────────
function draw() {
  // ── Stats ──
  document.getElementById('v-target').textContent = G.target;

  const prev  = preview();
  const resEl = document.getElementById('v-result');
  resEl.textContent = prev;
  resEl.className = 'stat-val';
  if (G.state === 'play') {
    if      (prev > G.target)  resEl.classList.add('over');
    else if (prev === G.target) resEl.classList.add('match');
    else                        resEl.classList.add('preview');
  }

  // ── Build pair lookup maps ──
  const nPair = new Map(); // ni → pairIdx
  const sPair = new Map(); // si → pairIdx
  G.pairs.forEach(p => { nPair.set(p.ni, p.pairIdx); sPair.set(p.si, p.pairIdx); });

  // ── Arena ──
  const arena = document.getElementById('arena');
  arena.innerHTML = '';

  const colL = el('div', 'col-l');
  const colC = el('div', 'col-c');
  const colR = el('div', 'col-r');

  for (let i = 0; i < 3; i++) {
    // ── Number item ──
    const nDiv = el('div', 'item');
    nDiv.textContent = G.nums[i];

    if (G.usedN.has(i)) {
      nDiv.classList.add('done');
      const pi = nPair.get(i);
      nDiv.appendChild(badge(PAIR_COLORS[pi]));
    } else if (i === G.nc) {
      nDiv.classList.add('cur-n');
    }
    colL.appendChild(nDiv);

    // ── Center connector ──
    const cDiv = el('div', 'mid-cell');
    const nUsed = G.usedN.has(i);
    const sUsed = G.usedS.has(i);
    if (nUsed && sUsed && nPair.get(i) === sPair.get(i)) {
      // same row number and symbol are linked
      const pi = nPair.get(i);
      cDiv.classList.add(`linked-${pi}`);
      cDiv.textContent = '─';
    } else if (!nUsed && i === G.nc && !sUsed && i === G.sc) {
      cDiv.classList.add('active');
      cDiv.textContent = '▶';
    } else {
      cDiv.textContent = '·';
    }
    colC.appendChild(cDiv);

    // ── Symbol item ──
    const sDiv = el('div', 'item');
    sDiv.textContent = G.syms[i].c;

    if (G.usedS.has(i)) {
      sDiv.classList.add('done');
      const pi = sPair.get(i);
      sDiv.appendChild(badge(PAIR_COLORS[pi]));
      // reveal multiplier after confirm
      const tag = el('span', 'mult-tag');
      tag.textContent = `×${G.syms[i].m}`;
      tag.style.color = PAIR_COLORS[pi];
      sDiv.appendChild(tag);
    } else if (i === G.sc) {
      sDiv.classList.add('cur-s');
    }
    colR.appendChild(sDiv);
  }

  arena.appendChild(colL);
  arena.appendChild(colC);
  arena.appendChild(colR);

  // ── Log ──
  const logEl = document.getElementById('log');
  logEl.innerHTML = '';

  if (G.pairs.length === 0) {
    const e = el('div', 'log-empty');
    e.textContent = 'NO PAIRS YET';
    logEl.appendChild(e);
  } else {
    G.pairs.forEach(p => {
      const row = el('div', 'log-row');
      const dot = el('span', 'log-dot');
      dot.style.background = PAIR_COLORS[p.pairIdx];
      const txt = el('span');
      txt.style.color = PAIR_COLORS[p.pairIdx];
      txt.textContent =
        `${G.nums[p.ni]}  ×  ${G.syms[p.si].c}  =  ${p.val}` +
        `   (×${G.syms[p.si].m})`;
      row.appendChild(dot);
      row.appendChild(txt);
      logEl.appendChild(row);
    });
  }
}

// ────────────────────────────────────────────────
// DOM helpers
// ────────────────────────────────────────────────
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function badge(color) {
  const b = el('span', 'badge');
  b.style.background = color;
  return b;
}

// ────────────────────────────────────────────────
// Boot
// ────────────────────────────────────────────────
document.addEventListener('keydown', onKey);
init();
</script>
</body>
</html>
